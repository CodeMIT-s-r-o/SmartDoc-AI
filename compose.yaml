# Local development stack. Production uses deploy/compose.prod.yml (Weekend 2).
# Cognito and S3 are real dev resources (Block 1.2); nothing AWS-related is emulated here.
name: smartdoc

x-app-db-url: &app-db-url postgresql://smartdoc_app:${DB_APP_PASSWORD:-smartdoc_app_dev}@db:5432/smartdoc

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    command: ['postgres', '-c', 'max_connections=30']
    shm_size: 128m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-smartdoc_owner_dev}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-smartdoc_app_dev}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smartdoc']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: '3000'
      DATABASE_URL: *app-db-url
      AI_URL: http://ai:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token-change-me}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ai:
    build:
      context: services/ai
      target: dev
    image: smartdoc-ai:dev
    environment:
      DATABASE_URL: *app-db-url
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./services/ai/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-worker:
    image: smartdoc-ai:dev
    command: ['python', '-m', 'app.ingest.worker']
    environment:
      DATABASE_URL: *app-db-url
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./services/ai/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.ingest.healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
