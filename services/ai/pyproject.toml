[project]
name = "smartdoc-ai"
version = "0.1.0"
description = "SmartDoc AI: ingestion worker and RAG service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app", "evals"]

[[tool.mypy.overrides]]
# reportlab ships no type information; only the eval harness and dev scripts use it.
module = ["reportlab.*"]
ignore_missing_imports = true
